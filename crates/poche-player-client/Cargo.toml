[package]
name = "poche-player-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Transport-neutral exact-recipient Poche device client"

[features]
default = []
http = ["dep:getrandom", "dep:poche-capture", "dep:serde_json", "dep:ureq"]
protected-store = [
    "dep:directories",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:keyring-manager",
    "dep:poche-capture",
    "dep:serde_json",
    "dep:tempfile",
    "dep:zeroize",
]

[dependencies]
blake3.workspace = true
directories = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
facet.workspace = true
getrandom = { workspace = true, optional = true }
keyring-manager = { workspace = true, optional = true }
poche-protocol = { path = "../poche-protocol" }
poche-capture = { path = "../poche-capture", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
