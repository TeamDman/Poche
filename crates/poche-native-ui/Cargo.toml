[package]
name = "poche-native-ui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bevy leaf adapter for Poche's canonical spatial presentation"

[features]
# Acceptance harness only; never enabled by the normal desktop entrypoint.
input-probe = []
# Opt-in local developer control. It drives Bevy input and observations through
# bounded files; it is not a game transport or a player device.
dev-control = []

[dependencies]
bevy = { workspace = true, features = ["ui", "system_clipboard"] }
blake3.workspace = true
getrandom.workspace = true
image.workspace = true
poche-capture = { path = "../poche-capture" }
poche-player-client = { path = "../poche-player-client" }
poche-protocol = { path = "../poche-protocol" }
poche-runtime = { path = "../poche-runtime" }
poche-session = { path = "../poche-session" }
poche-slug = { path = "../poche-slug" }
poche-spatial = { path = "../poche-spatial" }
poche-ui = { path = "../poche-ui" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
