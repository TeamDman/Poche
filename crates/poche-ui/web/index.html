<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Poche projection replay</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #171b1a;
      }

      canvas {
        display: block;
      }

      #status {
        position: fixed;
        inset: 1rem auto auto 1rem;
        z-index: 1;
        max-width: min(36rem, calc(100% - 2rem));
        padding: 0.75rem 1rem;
        border-radius: 0.35rem;
        color: #f7efe1;
        background: #262d2b;
        font: 0.95rem/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p id="status" role="status">Loading the static Poche replay…</p>
    <canvas id="poche-replay" aria-label="Poche projection replay"></canvas>
    <script type="module">
      import init, { WebHandle } from "./pkg/poche_ui.js";

      const status = document.querySelector("#status");
      const canvas = document.querySelector("#poche-replay");

      try {
        await init();
        const handle = new WebHandle();
        await handle.start(canvas);
        window.pocheReplay = handle;
        status.remove();
      } catch (error) {
        console.error("Poche replay startup failed", error);
        status.textContent = `Replay startup failed: ${String(error)}`;
      }
    </script>
  </body>
</html>
