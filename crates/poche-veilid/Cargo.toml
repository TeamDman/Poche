[package]
name = "poche-veilid"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Optional native observer acceptance, composed with mock or real transport tests.
native-input-test = ["dep:poche-native-ui", "poche-native-ui/input-probe", "veilid-core?/debug-api"]
veilid = ["dep:veilid-core"]
device-transport = ["veilid", "dep:tokio", "dep:poche-player-client"]
device-service = ["device-transport", "dep:poche-runtime", "dep:poche-session"]
# Separate build configuration: the upstream mock replaces the network API.
# Never enable this feature in a production desktop build.
veilid-mock-test = ["veilid", "veilid-core/mock-api"]
veilid-local-test = [
    "veilid",
    "veilid-core/footgun-nodeid-target",
    "dep:tempfile",
    "dep:tokio",
]
veilid-public-test = [
    "veilid",
    "insecure-development",
    "dep:poche-environment",
    "dep:poche-oracle-rust",
    "dep:poche-runtime",
    "dep:poche-session",
    "dep:tempfile",
    "dep:tokio",
]
# Standalone public-network latency probe. This intentionally excludes the
# Poche reducer, session authority, persistence, DHT rendezvous, and UI.
veilid-latency-probe = ["veilid", "dep:tempfile", "dep:tokio"]
insecure-development = []

[dependencies]
poche-native-ui = { path = "../poche-native-ui", optional = true }
blake3.workspace = true
curve25519-dalek.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
poche-environment = { path = "../poche-environment", optional = true }
poche-oracle-rust = { path = "../poche-oracle-rust", optional = true }
poche-protocol = { path = "../poche-protocol" }
poche-player-client = { path = "../poche-player-client", optional = true }
poche-runtime = { path = "../poche-runtime", optional = true }
poche-session = { path = "../poche-session", optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing.workspace = true
veilid-core = { workspace = true, optional = true }

[dev-dependencies]
poche-runtime = { path = "../poche-runtime" }
poche-session = { path = "../poche-session" }
tempfile.workspace = true
tokio.workspace = true

[[bin]]
name = "poche-veilid-local-probe"
path = "src/bin/local_probe.rs"
required-features = ["veilid-local-test"]

[[bin]]
name = "poche-veilid-public-probe"
path = "src/bin/public_probe.rs"
required-features = ["veilid-public-test"]

[[bin]]
name = "poche-veilid-latency-probe"
path = "src/bin/latency_probe.rs"
required-features = ["veilid-latency-probe"]

[[bin]]
name = "poche-veilid-native-smoke"
path = "src/bin/native_smoke.rs"
required-features = ["veilid-public-test"]

[lints]
workspace = true
