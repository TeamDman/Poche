[package]
name = "poche-spacetimedb-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Low-latency Bevy desktop table backed by SpacetimeDB"
default-run = "poche"

[lib]
name = "poche_spacetimedb_desktop"
path = "src/lib.rs"

[[bin]]
name = "poche"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["system_clipboard", "ui"] }
getrandom.workspace = true
image.workspace = true
poche-bevy-spacetimedb = { path = "../poche-bevy-spacetimedb" }
poche-slug = { path = "../poche-slug" }
poche-spatial = { path = "../poche-spatial" }
poche-spacetimedb-client = { path = "../poche-spacetimedb-client" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "poche-puppet"
path = "src/bin/poche-puppet.rs"

[lints]
workspace = true
