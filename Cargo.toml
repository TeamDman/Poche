[workspace]
members = ["crates/poche-oracle-rust", "crates/poche-xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["TeamDman"]
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/TeamDman/Poche"

[workspace.dependencies]
facet = "=0.50.0-rc.5"
phon = "=0.2.0-rc.5"
weavy = "=0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
