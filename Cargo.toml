[workspace]
members = ["crates/poche-burn", "crates/poche-capture", "crates/poche-check", "crates/poche-cli", "crates/poche-conformance", "crates/poche-crypto-prototype", "crates/poche-domain", "crates/poche-environment", "crates/poche-formal", "crates/poche-interchange", "crates/poche-model", "crates/poche-native-tools", "crates/poche-native-ui", "crates/poche-oracle-rust", "crates/poche-player-client", "crates/poche-protocol", "crates/poche-puppet", "crates/poche-rl", "crates/poche-runtime", "crates/poche-session", "crates/poche-slug", "crates/poche-spatial", "crates/poche-ui", "crates/poche-veilid", "crates/poche-web-spike", "crates/poche-xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["TeamDman"]
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/TeamDman/Poche"

[workspace.dependencies]
ark-serialize = { version = "=0.5.0", default-features = false }
async-tungstenite = { version = "=0.34.1", features = ["tokio-runtime"] }
bevy = { version = "=0.19.1", default-features = false, features = ["3d"] }
blake3 = "=1.8.5"
chacha20poly1305 = "=0.11.0"
burn = { version = "=0.21.0", default-features = false, features = ["std", "autodiff", "flex", "wgpu", "store"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["precomputed-tables", "zeroize"] }
datastar = { version = "=0.3.1", features = ["axum"] }
data-encoding = "=2.11.0"
directories = "=6.0.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "web_screen_reader"] }
facet = "=0.50.0-rc.5"
figue = "=5.0.0-rc.5"
flate2 = "=1.1.9"
futures-util = "=0.3.33"
getrandom = "=0.3.4"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
keyring-manager = "=0.8.3"
num-traits = "=0.2.19"
phon = "=0.2.0-rc.5"
rand = "=0.8.7"
rand_chacha = "=0.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
ttf-parser = "=0.25.1"
ureq = { version = "=2.12.1", features = ["json"] }
weavy = "=0.2.2"
veilid-core = { git = "https://gitlab.com/veilid/veilid.git", rev = "99c9616295f9195c97bf2f5f6b43f0d220ac5d8b", default-features = false, features = ["rt-tokio", "enable-crypto-vld0"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = ["HtmlCanvasElement"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
ziffle = "=0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
