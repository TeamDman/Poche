[workspace.package]
authors = ["TeamDman"]
repository = "https://github.com/TeamDman/Poche"
readme = "README.md"
license = "MPLv2"
edition = "2024"
rust-version = "1.86.0"

[workspace]
members = ["crates/game", "crates/bevy", "examples/*"]
resolver = "3"

[workspace.dependencies]
poche_game = { path = "crates/game" }
poche_bevy = { path = "crates/bevy" }
color-eyre = "0.6.3"
eyre = "0.6.12"
itertools = "0.14.0"
rand = "0.9.0"
rand_chacha = "0.9.0"
strum = { version = "0.27.1", features = ["derive"] }
futures = "0.3.31"
bevy = { version = "0.15.3" }
bevy_framepace = { version = "0.18.1" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[workspace.lints.rust]