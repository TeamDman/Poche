[workspace]
members = ["crates/poche-check", "crates/poche-cli", "crates/poche-conformance", "crates/poche-domain", "crates/poche-environment", "crates/poche-formal", "crates/poche-interchange", "crates/poche-model", "crates/poche-native-tools", "crates/poche-oracle-rust", "crates/poche-protocol", "crates/poche-runtime", "crates/poche-session", "crates/poche-ui", "crates/poche-veilid", "crates/poche-xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["TeamDman"]
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/TeamDman/Poche"

[workspace.dependencies]
blake3 = "=1.8.5"
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["precomputed-tables", "zeroize"] }
data-encoding = "=2.11.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "web_screen_reader"] }
facet = "=0.50.0-rc.5"
getrandom = "=0.3.4"
phon = "=0.2.0-rc.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
weavy = "=0.2.2"
veilid-core = { version = "=0.5.7", default-features = false, features = ["rt-tokio", "enable-crypto-vld0"] }
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["HtmlCanvasElement"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
