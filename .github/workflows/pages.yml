name: Publish rulebook

on:
  push:
    branches:
      - model-checking
    paths:
      - .github/workflows/pages.yml
      - docs/main.typ
      - pages/**
      - tools/versions.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/model-checking'
    runs-on: ubuntu-latest
    steps:
      - name: Check out model-checking
        uses: actions/checkout@v7

      - name: Install required fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-texgyre
          fc-match "TeX Gyre Termes" | grep --ignore-case texgyretermes
          fc-match "TeX Gyre Cursor" | grep --ignore-case texgyrecursor

      - name: Install pinned Typst
        env:
          TYPST_ARCHIVE_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
          TYPST_VERSION: 0.15.1
        run: |
          archive="$RUNNER_TEMP/typst.tar.xz"
          install_dir="$RUNNER_TEMP/typst"
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${TYPST_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          test "$("$install_dir/typst" --version)" = "typst 0.15.1 (9dfd3a08)"
          echo "TYPST_BIN=$install_dir/typst" >> "$GITHUB_ENV"

      - name: Build publication artifact
        env:
          PUBLICATION_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          mkdir --parents site
          "$TYPST_BIN" compile --root . docs/main.typ site/poche-rules.pdf
          test -s site/poche-rules.pdf
          build_time="${PUBLICATION_TIME:-workflow-dispatch}"
          sed \
            -e "s/__POCHE_GIT_SHA__/${GITHUB_SHA}/g" \
            -e "s/__POCHE_BUILD_TIME__/${build_time}/g" \
            pages/index.html > site/index.html
          cp LICENSE site/LICENSE.txt
          test -s site/index.html
          ! grep --recursive '__POCHE_' site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/model-checking'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
